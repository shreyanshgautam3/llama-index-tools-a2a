[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-tools-a2a"
version = "0.1.1"
description = "A2A (Agent-to-Agent) Protocol integration for LlamaIndex"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<4.0"
authors = [
    {name = "Shreyansh Gautam", email = "shreyanshgautam@gmail.com"}
]
keywords = [
    "a2a",
    "agent-to-agent",
    "google-a2a",
    "llama-index",
    "tools",
    "agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "a2a-sdk[http-server]>=0.1.0,<1",
    "llama-index-core>=0.13.0,<0.15",
    "pydantic>=2.0.0,<3",
    "httpx>=0.27.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-requests>=2.28.0",
    "uvicorn>=0.23.0",
    "fastapi>=0.100.0",
]

[project.urls]
Homepage = "https://github.com/shreyanshgautam3/llama-index-tools-a2a"
Documentation = "https://github.com/shreyanshgautam3/llama-index-tools-a2a#readme"
Repository = "https://github.com/shreyanshgautam3/llama-index-tools-a2a.git"
Issues = "https://github.com/shreyanshgautam3/llama-index-tools-a2a/issues"

[tool.hatch.build.targets.wheel]
packages = ["llama_index/tools/a2a"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
