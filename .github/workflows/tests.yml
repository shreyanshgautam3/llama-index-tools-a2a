name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
      fail-fast: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" --timeout 120 --retries 3
      - name: Debug - show versions
        run: |
          python -c "import sys; print(f'Python: {sys.version}')"
          pip list | grep -E "a2a|llama|pydantic|httpx|pytest|anyio|asyncio"
      - name: Lint
        run: ruff check .
      - name: Test
        run: |
          pytest -v --tb=short --asyncio-mode=strict
